name: Deploy Dev

on:
  push:
    branches:
      - dev

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: Deploy dev to Cloud Run
    runs-on: ubuntu-latest
    environment: dev

    env:
      PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      REGION: us-central1
      ARTIFACT_REPOSITORY: fastapi-services
      SERVICE_NAME: andelaassessment-dev
      TERRAFORM_STATE_BUCKET: ${{ secrets.TERRAFORM_STATE_BUCKET }}
      TF_VAR_project_id: ${{ secrets.GCP_PROJECT_ID }}
      TF_VAR_region: us-central1
      TF_VAR_environment: dev

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Set image name
        run: echo "TF_VAR_image_name=${REGION}-docker.pkg.dev/${PROJECT_ID}/${ARTIFACT_REPOSITORY}/${SERVICE_NAME}:dev-${GITHUB_SHA}" >> "${GITHUB_ENV}"

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - name: Build image
        run: docker build --tag "${TF_VAR_image_name}" .

      - name: Push image
        run: docker push "${TF_VAR_image_name}"

      - name: Terraform init
        working-directory: terraform
        run: terraform init -backend-config="bucket=${TERRAFORM_STATE_BUCKET}" -backend-config="prefix=terraform/state/dev"

      - name: Terraform apply
        working-directory: terraform
        run: terraform apply -auto-approve
