name: Deploy Staging

on:
  push:
    branches:
      - staging

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy staging to Cloud Run
    runs-on: ubuntu-latest
    environment: staging

    env:
      PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      REGION: us-central1
      TERRAFORM_STATE_BUCKET: ${{ secrets.TERRAFORM_STATE_BUCKET }}
      TF_VAR_project_id: ${{ secrets.GCP_PROJECT_ID }}
      TF_VAR_region: us-central1
      TF_VAR_environment: staging
      TF_VAR_image_tag: staging-${{ github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Ensure Terraform state bucket
        run: |
          gcloud storage buckets describe "gs://${TERRAFORM_STATE_BUCKET}" >/dev/null 2>&1 || \
            gcloud storage buckets create "gs://${TERRAFORM_STATE_BUCKET}" \
              --project="${PROJECT_ID}" \
              --location="${REGION}" \
              --uniform-bucket-level-access

      - name: Terraform init
        working-directory: terraform
        run: terraform init -backend-config="bucket=${TERRAFORM_STATE_BUCKET}" -backend-config="prefix=terraform/state/staging"

      - name: Terraform apply
        working-directory: terraform
        run: terraform apply -auto-approve
